name: Test offline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test senza modelli o GPU
        run: python -m unittest discover -s tests -v
      - name: Sintassi degli script shell
        run: |
          for script in *.sh; do
            sh -n "$script"
          done
